<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>🧠 AI Study Assistant</h1>
            <p>Powered by Pinecone, CrewAI & Groq</p>
        </header>
        
        <div class="content-wrapper">
            <div class="upload-section">
                <label class="custom-file-upload">
                    <input type="file" id="pdf-upload" accept=".pdf" onchange="updateFileName()">
                    <span id="file-label">📄 Select PDF Document</span>
                </label>
                <button id="upload-btn" onclick="uploadPDF()">☁️ Upload to Pinecone</button>
                <p id="upload-status"></p>
            </div>

            <div>
                <div id="chat-box" class="chat-box">
                    <div class="message ai-msg">
                        <b>Assistant:</b> Hello! Upload a study document above, and then ask me any questions about it.
                    </div>
                </div>
                
                <div class="input-area">
                    <button id="mic-btn" onclick="startDictation()" title="Use Microphone">🎤</button>
                    <input type="text" id="question-input" placeholder="Ask a question about your document..." onkeypress="handleEnter(event)">
                    <button onclick="askQuestion()">Send 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('pdf-upload');
            const label = document.getElementById('file-label');
            const uploadBtn = document.getElementById('upload-btn');
            
            if (input.files.length > 0) {
                label.innerHTML = `📄 ${input.files[0].name}`;
                // Reset upload button if a new file is chosen
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = "☁️ Upload to Pinecone";
                uploadBtn.style.backgroundColor = "var(--primary)";
                document.getElementById('upload-status').innerText = "";
            } else {
                label.innerHTML = `📄 Select PDF Document`;
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('pdf-upload');
            const statusText = document.getElementById('upload-status');
            const uploadBtn = document.getElementById('upload-btn');
            
            if (!fileInput.files[0]) {
                statusText.innerText = "⚠️ Please select a file first.";
                statusText.style.color = "#D97706";
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            // Visual loading state
            statusText.innerText = "⏳ Uploading and indexing... please wait.";
            statusText.style.color = "var(--primary)";
            uploadBtn.innerHTML = "⏳ Uploading...";
            uploadBtn.disabled = true;
            uploadBtn.style.opacity = "0.7";

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const result = await res.json();
                
                if (res.ok) {
                    // Success state
                    statusText.innerText = "✅ Document is ready to chat!";
                    statusText.style.color = "#059669";
                    uploadBtn.innerHTML = "✅ Uploaded";
                    uploadBtn.style.backgroundColor = "#059669";
                    uploadBtn.style.opacity = "1";
                } else {
                    // Error state
                    statusText.innerText = "❌ Error: " + result.error;
                    statusText.style.color = "#DC2626";
                    uploadBtn.innerHTML = "☁️ Try Again";
                    uploadBtn.disabled = false;
                    uploadBtn.style.opacity = "1";
                }
            } catch (e) {
                statusText.innerText = "❌ Upload failed. Check server connection.";
                statusText.style.color = "#DC2626";
                uploadBtn.innerHTML = "☁️ Try Again";
                uploadBtn.disabled = false;
                uploadBtn.style.opacity = "1";
            }
        }

        async function askQuestion() {
            const inputField = document.getElementById('question-input');
            const chatBox = document.getElementById('chat-box');
            const question = inputField.value.trim();
            if (!question) return;

            chatBox.innerHTML += `<div class="message user-msg">${question}</div>`;
            inputField.value = '';
            
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="message sys-msg">✨ Agents are analyzing the document...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const result = await res.json();
                
                document.getElementById(loadingId).remove();
                
                if (res.ok) {
                    const formatted = result.answer.replace(/\n/g, '<br>');
                    const cleanText = result.answer.replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/"/g, '\\"');
                    
                    chatBox.innerHTML += `
                        <div class="message ai-msg">
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${cleanText}')">📋 Copy</button>
                            <b>Answer:</b><br><br>${formatted}
                        </div>`;
                } else {
                    chatBox.innerHTML += `<div class="message error-msg"><b>Error:</b> ${result.error}</div>`;
                }
            } catch (e) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message error-msg">⚠️ Server communication failed.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startDictation() {
            if (window.webkitSpeechRecognition || window.SpeechRecognition) {
                const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
                const recognition = new SpeechRecognition();
                const micBtn = document.getElementById('mic-btn');
                
                recognition.start();
                micBtn.classList.add('mic-active');
                
                recognition.onresult = function(e) {
                    document.getElementById('question-input').value = e.results[0][0].transcript;
                    micBtn.classList.remove('mic-active');
                };
                
                recognition.onerror = function() { micBtn.classList.remove('mic-active'); };
                recognition.onend = function() { micBtn.classList.remove('mic-active'); };
            } else {
                alert("Speech recognition is not supported in your current browser.");
            }
        }
    </script>
</body>
</html>
